# ==============================================================================
# 中华人民共和国广告法 合规风控规则库
# 依据：《中华人民共和国广告法》(2021修正版) 第九条、第十七条、第二十八条
# ==============================================================================

name: china_advertising_law_policy
version: "1.0"
platform: general

rules:
  # 1. 极限词 / 绝对化用语 (广告法第九条第三项: 广告不得使用“国家级”、“最高级”、“最佳”等用语)
  - id: ADV-001
    name: absolute_superlative_terms
    category: absolute_claim
    severity: BLOCK
    description: 严禁使用极限词、顶级、绝对化宣传用语
    patterns:
      - "最"
      - "第一"
      - "顶级"
      - "极品"
      - "极致"
      - "全网首发"
      - "全网第一"
      - "销量第一"
      - "全网最佳"
      - "行业第一"
      - "独一无二"
      - "无可替代"
      - "前所未有"
      - "史无前例"
    cited_regulation: "《中华人民共和国广告法》第九条第(三)项"
    explanation: "《广告法》明确禁止在商品营销中使用国家级、最高级、最佳等绝对化用语，违者处20万元以上100万元以下罚款。"
    suggestion: "替换为客观、中立描述，例如：热销款式、品质严选、备受好评、精心设计"

  # 2. 绝对化品质与永久保证承诺
  - id: ADV-002
    name: absolute_guarantee_terms
    category: absolute_claim
    severity: REQUIRE_APPROVAL
    description: 杜绝无法自证的100%纯天然、永久有效等绝对化品质承诺
    patterns:
      - "100%纯天然"
      - "100%有效"
      - "永久有效"
      - "永不褪色"
      - "永不生锈"
      - "万能"
      - "彻底清除"
      - "零风险"
      - "保本保收益"
    cited_regulation: "《中华人民共和国广告法》第二十八条"
    explanation: "对商品或服务的效果作虚假或无法自证的绝对化保证承诺，构成虚假广告。"
    suggestion: "如实描述成分或耐用年限，如：天然成分萃取、长效持久、经久耐用"

  # 3. 非药品/非医疗器械宣称疾病治疗功效 (广告法第十七条)
  - id: ADV-003
    name: medical_efficacy_claims
    category: false_efficacy
    severity: BLOCK
    description: 普通食品、化妆品及日用品严禁宣称医疗功效或疾病治疗作用
    patterns:
      - "治愈"
      - "根治"
      - "特效药"
      - "消炎"
      - "降三高"
      - "抗癌"
      - "抗肿瘤"
      - "降血糖"
      - "祛斑根除"
      - "生发密发"
      - "治疗便秘"
    cited_regulation: "《中华人民共和国广告法》第十七条"
    explanation: "除医疗、药品、医疗器械广告外，禁止其他任何广告涉及疾病治疗功能，并不得使用医疗用语或者易使推销的商品与药品、医疗器械相混淆的用语。"
    suggestion: "回归普通商品功效：如化妆品使用“滋润保湿、修护肌肤屏障”，食品使用“营养丰富、清爽可口”"

  # 4. 虚假原价与价格欺诈 (广告法第二十八条第二款第二项)
  - id: ADV-004
    name: price_fraud_claims
    category: price_fraud
    severity: REQUIRE_APPROVAL
    description: 虚构原价、价格无依据或欺诈性降价宣传
    patterns:
      - "原价"
      - "专柜价"
      - "吊牌价"
      - "跳楼价"
      - "亏本甩卖"
      - "最后一天"
      - "史上最低"
    cited_regulation: "《明码标价和禁止价格欺诈规定》第十九条"
    explanation: "标示的原价如未在本次降价前七日内在本交易场所成交，或从未成交过，属于虚构原价的价格欺诈违法行为。"
    suggestion: "明确标注“建议零售价”或“日常促销价”，并保证价格历史记录真实可查"
