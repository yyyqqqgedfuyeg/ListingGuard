name: ListingGuard CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-syntax:
    name: Code Quality & Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify Python syntax and compilation
        run: |
          python -m compileall src tests eval configs

  test-and-eval:
    name: Automated Tests & Benchmark Evaluation
    needs: lint-and-syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Test Suite
        run: |
          pytest tests/ -v --junitxml=test-reports.xml

      - name: Run Benchmark Evaluation Pipeline
        run: |
          python eval/run_all_evals.py

      - name: Upload Evaluation Benchmark Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: listing-guard-eval-reports
          path: |
            eval/reports/
            test-reports.xml
